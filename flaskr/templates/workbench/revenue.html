{% extends 'base.html' %}
{% block title %}Revenue{% endblock %}
{% block content %}
<div class="page-top">
    <div>
        <div class="crumb">Money &amp; reports / Revenue</div>
        <h1 class="page-title">Revenue</h1>
        <p class="page-subtitle">Record daily sales and other incoming money.</p>
    </div>
    <div class="head-actions">
        <a class="btn soft" href="{{ url_for('workbench.reports') }}">See reports</a>
    </div>
</div>
<div class="form-layout">
    <section class="panel">
        <div class="section-label">↗ &nbsp; Money coming in</div>
        <h2>Record revenue</h2>
        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-grid">
                <label class="field">Source *
                    <select name="source" required>
                        <option>Restaurant sales</option>
                        <option>Event revenue</option>
                        <option>Other revenue</option>
                    </select>
                </label>

                <label class="field">Date *
                    <input type="date" name="revenue_date" value="{{ today }}" required>
                </label>

                <label class="field">Amount ($) *
                    <input type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
                </label>

                <label class="field">Description (optional)
                    <input type="text" name="description" maxlength="255" placeholder="Lunch service, catering, etc.">
                </label>
            </div>
            <div class="form-total"><div>
                <small>Revenue this month</small><strong>{{ totals.revenue_total | cash }}</strong>
            </div>
            <button class="btn primary" type="submit">Save revenue</button>
        </div>
    </form>
</section>
</div>
{% endblock %}
